[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openref-sim"
version = "0.2.0"
description = "Deterministic discrete-event simulator for OpenRef radio scheduling and recovery"
requires-python = ">=3.11"
dependencies = ["cryptography>=42.0", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
openref-sim = "openref_sim.cli:main"
openref-sweep = "openref_sim.sweep:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
